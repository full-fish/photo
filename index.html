<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>좋은 말로 할때 다들 오셈</title>
    <style>
      :root { color-scheme: dark; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #111;
        color: #eee;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      a { color: inherit; text-decoration: none; }

      /* ✅ 3열 그리드: 가운데 열을 고정 폭으로(최대 400px) */
      .container {
        width: 100%;
        max-width: 1200px;
        display: grid;
        grid-template-columns:
          clamp(44px, 12vw, 90px)
          minmax(260px, 400px)
          clamp(44px, 12vw, 90px);
        justify-content: center;
        align-items: start;
        gap: 3vw;
        padding: 4vh 2vw;
        box-sizing: border-box;
      }

      /* 사이드 스택 */
      .side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .img-box { position: relative; display: inline-block; }
      .side .img-box img {
        display: block;
        width: clamp(44px, 10vw, 90px);
        border-radius: 8px;
        opacity: 0.9;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .img-box:hover img { transform: scale(1.05); opacity: 1; }

      .caption {
        position: absolute; inset: 0;
        display: flex; justify-content: center; align-items: center;
        color: #fff; font-weight: bold; font-size: 0.9rem;
        background: rgba(0,0,0,0.5);
        border-radius: 8px; opacity: 0; transition: opacity .3s ease;
      }
      .img-box:hover .caption { opacity: 1; }

      /* ✅ 중앙 열: 수직 스택 + 중앙 정렬 */
      .center {
        display: flex;
        flex-direction: column;
        align-items: center;   /* 중앙 정렬 핵심 */
      }

      /* ✅ 메인 이미지: 중앙 열 너비(최대 400px)에 맞춰 100%로 */
      .center .img-box img {
        width: 100%;
        max-width: 400px;
        height: auto;
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(0,0,0,.5);
        display: block;
      }
      .center .caption { font-size: 1.6rem; border-radius: 16px; }

      /* 방명록: 메인 이미지와 동일 폭 */
      .guestbook {
        width: 100%;
        max-width: 400px;
        margin: 20px auto 0;
        display: grid;
        gap: 12px;
      }

      .form {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr auto;
        gap: 8px;
        align-items: center;
      }

      .input, .button {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #2a2a2a;
        background: #1a1a1a;
        color: #eee;
        font-size: 15px;
      }
      .input::placeholder { color: #8a8a8a; }

      .button {
        background: #3b82f6;
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
      .button:hover { filter: brightness(0.95); }

      .status {
        font-size: 13px;
        color: #cfcfcf;
        text-align: left;
        padding: 2px 4px;
        min-height: 20px;
      }

      .list { display: grid; gap: 8px; }
      .item {
        background: #1a1a1a;
        border: 1px solid #252525;
        border-radius: 10px;
        padding: 8px 10px;
        line-height: 1.4;
        word-break: break-word;
      }
      .time { display: block; color: #a0a0a0; font-size: 12px; margin-bottom: 4px; }
      .name { font-weight: 800; color: #fff; }
      .msg  { margin-left: 6px; color: #e7e7e7; }

      /* 아주 좁은 화면에서 입력라인 스택 */
      @media (max-width: 430px) {
        .form { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="side" id="left-side"></div>

      <div class="center">
        <div class="img-box">
          <a
            href="https://naver.me/xQiHE2HB"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="image.png" alt="중앙 이미지" />
            <div class="caption">초대장임 💌</div>
          </a>
        </div>

        <!-- 메인 이미지 아래 방명록 -->
        <section class="guestbook">
          <form id="guestForm" class="form" autocomplete="off">
            <input id="name" class="input" placeholder="이름" required />
            <input id="msg" class="input" placeholder="메시지 (선택)" />
            <button class="button" type="submit">저장</button>
          </form>

          <div id="status" class="status">불러오는 중...</div>
          <div id="list" class="list"></div>
        </section>
      </div>

      <div class="side" id="right-side"></div>
    </div>

    <script>
      /* ===== 사이드 이미지 구성 ===== */
      const sideImage = "yuri.jpeg";
      const sideText  = "귀여운 유리 💚";

      const left  = document.getElementById("left-side");
      const right = document.getElementById("right-side");
      const centerCol = document.querySelector(".center");

      function createSideBox() {
        const box = document.createElement("div");
        box.className = "img-box";
        const img = document.createElement("img");
        img.src = sideImage;
        img.alt = "작은 이미지";
        const cap = document.createElement("div");
        cap.className = "caption";
        cap.textContent = sideText;
        box.appendChild(img);
        box.appendChild(cap);
        return box;
      }

      function measureSideItemHeight() {
        let probe = left.querySelector(".img-box");
        let removeAfter = false;
        if (!probe) {
          probe = createSideBox();
          probe.style.visibility = "hidden";
          left.appendChild(probe);
          removeAfter = true;
        }
        const rect = probe.getBoundingClientRect();
        const gap  = 10;
        const itemH = rect.height + gap;
        if (removeAfter) left.removeChild(probe);
        return Math.max(1, Math.round(itemH));
      }

      function getCenterHeight() {
        const rect = centerCol.getBoundingClientRect();
        return Math.max(1, Math.round(rect.height));
      }

      function setChildrenCount(container, count) {
        const current = container.children.length;
        if (current < count) {
          for (let i = current; i < count; i++) container.appendChild(createSideBox());
        } else if (current > count) {
          while (container.children.length > count) {
            container.removeChild(container.lastElementChild);
          }
        }
      }

      // 중앙 높이에 맞춰 좌우 자동 증감(모바일 포함)
      function syncSidesWithCenter() {
        const centerH = getCenterHeight();
        const itemH   = measureSideItemHeight();
        const need    = Math.max(4, Math.ceil(centerH / itemH)); // 최소 4개 유지
        setChildrenCount(left, need);
        setChildrenCount(right, need);
      }

      function debounce(fn, ms = 120) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
      }
      const onResize = debounce(syncSidesWithCenter, 120);
      window.addEventListener("resize", onResize);

      const ro = new ResizeObserver(() => syncSidesWithCenter());
      ro.observe(centerCol);

      /* ===== 방명록 연동 ===== */
      const WEBAPP = "https://script.google.com/macros/s/AKfycbzNwl52rSDRx6IGZ2iymlkH7hM2cJwQCdKNMzFzRfyYqBsB_MB3c0cqwv11nVMexNz1Pg/exec";

      const statusEl = document.getElementById("status");
      const listEl   = document.getElementById("list");
      const formEl   = document.getElementById("guestForm");
      const nameEl   = document.getElementById("name");
      const msgEl    = document.getElementById("msg");

      function formatTime(iso) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" });
      }

      async function load(limit = 100) {
        statusEl.textContent = "불러오는 중...";
        listEl.innerHTML = "";
        try {
          const res = await fetch(`${WEBAPP}?limit=${limit}`);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "서버 오류");

          const rows = Array.isArray(data.rows) ? data.rows : [];
          if (rows.length === 0) {
            statusEl.textContent = "아직 등록된 방명록이 없습니다.";
            syncSidesWithCenter();
            return;
          }

          statusEl.textContent = "";
          for (const r of rows) {
            const time   = formatTime(r.ts);
            const name   = String(r.name || "");
            const msgHtml = String(r.msg || "").replace(/\n/g, "<br>");

            const item = document.createElement("div");
            item.className = "item";
            item.innerHTML = `
              <span class="time">${time}</span>
              <span class="name">${name}</span>
              ${msgHtml ? `<span class="msg">: ${msgHtml}</span>` : ""}
            `;
            listEl.appendChild(item);
          }
        } catch (err) {
          statusEl.textContent = "데이터 불러오기 실패: " + err.message;
          console.error("load error:", err);
        } finally {
          syncSidesWithCenter();
        }
      }

      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameEl.value.trim();
        const msg  = msgEl.value.trim();
        if (!name) return alert("이름은 필수입니다!");

        try {
          statusEl.textContent = "💾 저장 중입니다...";

          const res = await fetch(WEBAPP, {
            method: "POST",
            body: JSON.stringify({ name, msg })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "저장 실패");

          formEl.reset();
          await load();
          statusEl.textContent = "✅ 저장되었습니다!";
          setTimeout(() => (statusEl.textContent = ""), 1500);
        } catch (err) {
          alert("저장 실패: " + err.message);
          console.error("save error:", err);
          statusEl.textContent = "❌ 저장 실패";
        }
      });

      // 초기 셋업
      syncSidesWithCenter();
      load();
    </script>
  </body>
</html>
